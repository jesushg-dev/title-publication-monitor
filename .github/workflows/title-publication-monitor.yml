name: Monitor title publication

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 14 * * 1-6"
    - cron: "30 16 * * 1-6"
    - cron: "0 18 * * 1-6"
    - cron: "30 19 * * 1-6"
    - cron: "30 21 * * 1-6"
    - cron: "15 23 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: title-publication-monitor
  cancel-in-progress: false

jobs:
  check-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/cache/restore@v5
        with:
          path: .title-monitor-state
          key: lagaceta-title-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lagaceta-title-monitor-

      - name: Check La Gaceta and notify Telegram
        run: node scripts/check-lagaceta-title.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Save record and estimate JSON
        uses: actions/upload-artifact@v7
        with:
          name: title-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: .title-monitor-state/state.json
          include-hidden-files: true
          retention-days: 90

      - uses: actions/cache/save@v5
        if: always()
        with:
          path: .title-monitor-state
          key: lagaceta-title-monitor-${{ github.run_id }}-${{ github.run_attempt }}
